<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Woven linen, tileable. Warm and light, for the salons that do not want
       a dark room. Scaled so the weave reads as fabric rather than as noise. -->
  <defs>
    <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ece4d8"/>
      <rect width="5"  height="10" fill="#e0d6c6" opacity="0.9"/>
      <rect width="10" height="5"  fill="#f4efe6" opacity="0.65"/>
      <rect x="5" y="5" width="5" height="5" fill="#d8ccb9" opacity="0.5"/>
    </pattern>
    <filter id="slub" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.5" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#weave)"/>
  <rect width="900" height="600" filter="url(#slub)" opacity="0.55"/>
</svg>
