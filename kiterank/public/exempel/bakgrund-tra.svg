<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Planks, drawn to tile: no vignette and no directional shading, so the
       texture keeps its scale however tall the page gets. The darkening that
       makes text readable is applied in CSS, once, on top. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.14" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
    </filter>
    <filter id="knot" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.06" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7"/>
    </filter>
    <!-- A knot is rings, not a stain: concentric ellipses, nudged out of
         round by the displacement above so no two look stamped. -->
    <g id="ring">
      <ellipse rx="26" ry="13" fill="none" stroke="#3a2411" stroke-width="2.5" stroke-opacity="0.55"/>
      <ellipse rx="19" ry="9.5" fill="none" stroke="#33200f" stroke-width="2" stroke-opacity="0.6"/>
      <ellipse rx="12" ry="6"  fill="none" stroke="#2c1b0d" stroke-width="2" stroke-opacity="0.7"/>
      <ellipse rx="5"  ry="2.5" fill="#281809" fill-opacity="0.75"/>
    </g>
  </defs>

  <rect width="900" height="600" fill="#6f4c30"/>

  <!-- Six planks, alternating tone hard enough to survive a dark scrim -->
  <g>
    <rect y="0"   width="900" height="100" fill="#8a6039"/>
    <rect y="100" width="900" height="100" fill="#69472b"/>
    <rect y="200" width="900" height="100" fill="#7d5634"/>
    <rect y="300" width="900" height="100" fill="#5f4026"/>
    <rect y="400" width="900" height="100" fill="#835b36"/>
    <rect y="500" width="900" height="100" fill="#6b4a2d"/>
  </g>

  <!-- Seams, drawn as a dark line with a light edge under it -->
  <g>
    <g stroke="#2e1c0f" stroke-width="3" stroke-opacity="0.85">
      <line x1="0" y1="100" x2="900" y2="100"/><line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="0" y1="300" x2="900" y2="300"/><line x1="0" y1="400" x2="900" y2="400"/>
      <line x1="0" y1="500" x2="900" y2="500"/>
    </g>
    <g stroke="#b98a55" stroke-width="1" stroke-opacity="0.4">
      <line x1="0" y1="103" x2="900" y2="103"/><line x1="0" y1="203" x2="900" y2="203"/>
      <line x1="0" y1="303" x2="900" y2="303"/><line x1="0" y1="403" x2="900" y2="403"/>
      <line x1="0" y1="503" x2="900" y2="503"/>
    </g>
  </g>

  <g filter="url(#knot)">
    <use href="#ring" x="190" y="52"/>
    <use href="#ring" x="660" y="252" transform="translate(660,252) scale(1.15) translate(-660,-252)"/>
    <use href="#ring" x="390" y="452" transform="translate(390,452) scale(0.85) translate(-390,-452)"/>
    <use href="#ring" x="800" y="552" transform="translate(800,552) scale(0.75) translate(-800,-552)"/>
  </g>

  <rect width="900" height="600" filter="url(#grain)" opacity="0.55"/>
</svg>
