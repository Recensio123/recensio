<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Running-bond brick, tileable. The pattern repeats on a 240×120 grid,
       which divides evenly into 900×600 only horizontally — the offset rows
       are drawn to wrap, so a vertical tile shows no seam. -->
  <defs>
    <!-- 180×72 courses: at the size the surface is tiled on screen this puts
         a brick at roughly the width one is in a photograph of a wall. -->
    <pattern id="bond" width="180" height="72" patternUnits="userSpaceOnUse">
      <rect width="180" height="72" fill="#6f625a"/>
      <g>
        <rect x="3"   y="3"  width="84" height="30" rx="1.5" fill="#a35f45"/>
        <rect x="93"  y="3"  width="84" height="30" rx="1.5" fill="#93543d"/>
        <rect x="-42" y="39" width="84" height="30" rx="1.5" fill="#9c5a41"/>
        <rect x="48"  y="39" width="84" height="30" rx="1.5" fill="#ab664a"/>
        <rect x="138" y="39" width="84" height="30" rx="1.5" fill="#8e5039"/>
      </g>
    </pattern>
    <filter id="rough" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bond)"/>
  <rect width="900" height="600" filter="url(#rough)" opacity="0.6"/>
</svg>
